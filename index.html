<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TREDT SMP 2 Public Archive</title>

<style>
:root {
    --crt-green: #33ff33;
    --crt-green-glow: rgba(51, 255, 51, 0.6);
    --crt-bg: #050e05;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--crt-bg);
    color: var(--crt-green);
    font-family: "Courier New", monospace;
    overflow: hidden;
    /* Phosphor Text Glow */
    text-shadow: 0 0 5px var(--crt-green-glow), 0 0 10px var(--crt-green-glow);
}

/* CRT Screen Scanlines, Curve Vignette, & Flicker Overlay */
.crt-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: 
        radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.85) 100%),
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
    background-size: 100% 100%, 100% 4px;
    box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95);
    animation: flicker 0.15s infinite;
}

@keyframes flicker {
    0% { opacity: 0.96; }
    50% { opacity: 1; }
    100% { opacity: 0.98; }
}

.screen {
    position: absolute;
    inset: 0;
    padding: 35px;
    box-sizing: border-box;
    overflow-y: auto;
}

#startScreen {
    display: flex;
    justify-content: center;
    align-items: center;
}

#bootScreen,
#archiveScreen {
    display: none;
}

#openBtn {
    background: var(--crt-green);
    color: #000;
    border: 3px solid var(--crt-green);
    padding: 22px 46px;
    font-size: 30px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 18px var(--crt-green-glow);
    transition: all 0.2s ease;
}

#openBtn:hover {
    background: #000;
    color: var(--crt-green);
    box-shadow: 0 0 30px var(--crt-green);
}

#bootTerminal,
#archiveTerminal {
    white-space: pre-wrap;
    font-size: 22px;
    line-height: 1.4;
}

/* Glowing Block Cursor */
.cursor {
    display: inline-block;
    background-color: var(--crt-green);
    color: #000;
    margin-left: 2px;
    box-shadow: 0 0 8px var(--crt-green);
    animation: blink 1s steps(2) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

.buttonContainer {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 25px;
}

.downloadBtn {
    display: inline-block;
    padding: 14px 24px;
    border: 2px solid var(--crt-green);
    color: var(--crt-green);
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 0 10px var(--crt-green-glow);
    transition: all 0.2s ease;
}

.downloadBtn:hover {
    background: var(--crt-green);
    color: #000;
    box-shadow: 0 0 22px var(--crt-green);
}
</style>

</head>
<body>

<div class="crt-overlay"></div>

<div id="startScreen" class="screen">
    <button id="openBtn">OPEN ARCHIVE</button>
</div>

<div id="bootScreen" class="screen">
    <div id="bootTerminal"></div>
</div>

<div id="archiveScreen" class="screen">
    <div id="archiveTerminal"></div>
    <div class="buttonContainer">
        <a class="downloadBtn" href="https://github.com/TREDTCODER/tredtsmp2.0-archive/releases/download/v1.0/TREDTSMP2.Archive.zip" target="_blank">DOWNLOAD ARCHIVE</a>
        <a class="downloadBtn" href="#">OPEN 3D BLUEMAP</a>
    </div>
</div>

<script>
const bootLines = [
'TREDT UNION ARCHIVE V1.02(R) Archive System',
'Version 1.02',
'',
'Copyright (C) TREDT SMP 2023-2026',
'',
'Starting TREDT Archive BIOS v1.02',
'',
'System RAM..................... OK',
'Checking storage media.............. OK',
'Verifying archive integrity......... OK',
'Mounting read-only archive.......... OK',
'Loading historical records.......... OK',
'Initializing terminal............... OK',
'',
'NOTICE:',
'The TREDT SMP 2 server has been permanently dissolved.',
'A public historical archive has been established.',
'',
'Launching archive terminal...',
'',
'C:\\TREDT_ARCHIVE>'
];

const archiveText = `TREDT UNION ARCHIVE V1.02(R) Archive System

C:\\TREDT_ARCHIVE> dir

Volume in drive C is TREDT_ARCHIVE
Volume Serial Number is 25565-2026

Directory of C:\\TREDT_ARCHIVE

TREDT SMP 2 PUBLIC ARCHIVE

Status : Archived
Access : Public
Archive Size : 214 MB
File Size: 295 MB
Files : 8,230 
File Type: .zip
Directories : 340

The TREDT SMP 2 server has been permanently preserved
for public access.

Archive Period: 24 August 2026 to 25 September 2026.

Original Server:
IP: schmidt-capture.tun.ply.gg 
Port: 25565 
DNS: 127.0.0.1
Hosting Partners: Aternos GmbH & playit.gg (Developed Methods LLC)
Press the buttons below to access archive assets.

C:\\TREDT_ARCHIVE>`;

const bootTerminal = document.getElementById('bootTerminal');
const archiveTerminal = document.getElementById('archiveTerminal');

document.getElementById('openBtn').addEventListener('click', () => {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('bootScreen').style.display = 'block';

    bootTerminal.textContent = '';

    let index = 0;

    function printNextLine() {
        if (index < bootLines.length) {
            bootTerminal.textContent += bootLines[index] + '\n';
            index++;

            bootTerminal.scrollTop = bootTerminal.scrollHeight;

            setTimeout(printNextLine, 250);
        } else {
            setTimeout(showArchive, 500);
        }
    }

    printNextLine();
});

function showArchive() {
    document.getElementById('bootScreen').style.display = 'none';
    document.getElementById('archiveScreen').style.display = 'block';

    archiveTerminal.textContent = archiveText;

    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.textContent = ' ';
    archiveTerminal.appendChild(cursor);
}
</script>

</body>
</html>
